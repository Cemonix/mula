[package]
name = "mula"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A dual-pane terminal file manager in the Total Commander tradition"
repository = "https://github.com/Cemonix/mula"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.189"
ratatui = "0.30.2"
rustix = { version = "1.1.4", features = ["process", "termios"] }
thiserror = "2.0.20"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
trash = "5.2.6"
